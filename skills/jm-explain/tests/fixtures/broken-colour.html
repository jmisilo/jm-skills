<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>broken-colour</title>
<!-- Checker fixture (--gallery): colour group. Changes --accent, drops --well and adds --brand in :root, and uses literals outside the token block. Prose words like red and #fff and href=#fff are never scanned. -->
<style>
:root {
  --paper: #fafafa; --ink: #171717; --ink-2: #525252; --muted: #8f8f8f; --faint: #bdbdbd;
  --rule: #ebebeb; --accent: #2f81f7; --brand: #ff00aa; --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
  --fault: #c4362f;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace;
  --measure: 620px; --fig-width: 880px;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.6 var(--sans); }
.page { max-width: var(--measure); margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 22px; line-height: 1.3; font-weight: 600; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.sec { display: flex; align-items: center; gap: 12px; margin-top: 48px; }
.sec::after { content: ""; flex: 1; order: 1; border-top: 1px solid var(--rule); }
.idx { order: 2; }
.prompt { font: 13px/1.6 var(--mono); color: var(--ink-2); padding-left: 2ch; text-indent: -2ch; margin: 0; }
.prompt b { color: var(--ink); }
.caret { color: var(--muted); }
.meta, .idx, .fig-tag, .fig-hint, .fig-src { font: 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dl.terms dt { font: 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
dl.terms dd { margin: 0 0 12px; }
a { color: var(--ink); text-decoration-color: var(--faint); }
code { font: .9em var(--mono); border: 1px solid var(--rule); border-radius: 4px; padding: 0 3px; }
.inferred { text-decoration: underline dotted var(--faint); }
.fig { margin: 40px 0; border: 0; background: none; }
.fig-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.fig > svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.fig svg * { vector-effect: non-scaling-stroke; }
.fig svg text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); stroke: none; }
.fig svg text.lbl { font-size: 11px; }
.fig svg line, .fig svg rect, .fig svg path { fill: none; stroke: var(--ink-2); stroke-width: 1; }
.fig svg .subj { stroke: var(--accent); stroke-width: 1.5; }
.fig svg text.subj, .val { fill: var(--accent); color: var(--accent); stroke: none; }
.ascii { container-type: inline-size; }
.ascii pre { margin: 0; padding: 0; font-family: var(--mono); line-height: 1.2; color: var(--ink-2); user-select: none; font-size: min(1em, calc(100cqw / (var(--cols) * 0.62))); }
.ascii svg.ah path { fill: currentColor; stroke: none; }
.tl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font: 12px/1.4 var(--mono); color: var(--ink-2); }
.tl .track { position: relative; height: 8px; background: var(--well); }
.tl .bar { position: absolute; top: 0; bottom: 0; left: var(--s); width: var(--w); background: var(--ink-2); }
.tl .bar.subj { background: var(--accent); }
.tl .ticks { position: relative; height: 16px; }
.tl .ticks span { position: absolute; left: var(--x); transform: translateX(-50%); }
.tl .ticks span:last-child { transform: translateX(-100%); }
.tl .ticks span:first-child { transform: none; }
figcaption { margin-top: 16px; border-top: 1px dotted var(--rule); padding-top: 10px; font: 13px/1.5 var(--sans); color: var(--ink-2); }
.fig-src { display: block; margin-top: 4px; }
ol.sources { font-size: 13px; color: var(--ink-2); }
.x { color: #333; }
.y { border-top: 1px solid rgb(0 0 0 / 10%); }
.z { background: color-mix(in oklch, var(--ink) 50%, transparent); }
.w { outline-color: tomato; }
.ok-1 { color: var(--ink-2, var(--muted)); fill: currentColor; stroke: none; background: transparent; }
.ok-2 { font-family: "Tan Sans", var(--sans); content: "#fff"; }
@media (prefers-color-scheme: dark) { :root { --paper: #111111; } }
</style>
</head>
<body>
<main class="page">
  <figure class="fig" data-kind="schematic">
    <div class="fig-head"><span class="fig-tag">FIG. 1</span></div>
    <svg role="img" aria-label="Boxes with literal colours" viewBox="0 0 430 60" width="430" height="60"><rect x="10" y="10" width="40" height="40" fill="red"/><rect x="60" y="10" width="40" height="40" stroke="#0f0f0e"/><rect x="110" y="10" width="40" height="40" fill="url(#hatch)" stroke="var(--rule)"/><text x="160" y="34" style="fill: hsl(0 0% 20%)">label</text></svg>
    <figcaption>Red, #fff and <a href="#fff">#fff</a> in prose are fine.</figcaption>
  </figure>
  <p style="color: white">Inline literal.</p>
</main>
</body>
</html>
