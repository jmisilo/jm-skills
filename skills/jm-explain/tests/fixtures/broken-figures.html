<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>broken-figures</title>
<!-- Checker fixture (--gallery): figure group. Missing class, unknown kind, bad tag and numbering, two captions, role on figure, unlabelled and doubled bodies, a 60-column ascii line, two interactive figures and an unlabelled control. -->
<style>
:root {
  --paper: #fafafa; --ink: #171717; --ink-2: #525252; --muted: #8f8f8f; --faint: #bdbdbd;
  --rule: #ebebeb; --well: #efefef; --accent: #1f6feb; --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
  --fault: #c4362f;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace;
  --measure: 620px; --fig-width: 880px;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.6 var(--sans); }
.page { max-width: var(--measure); margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 22px; line-height: 1.3; font-weight: 600; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.sec { display: flex; align-items: center; gap: 12px; margin-top: 48px; }
.sec::after { content: ""; flex: 1; order: 1; border-top: 1px solid var(--rule); }
.idx { order: 2; }
.prompt { font: 13px/1.6 var(--mono); color: var(--ink-2); padding-left: 2ch; text-indent: -2ch; margin: 0; }
.prompt b { color: var(--ink); }
.caret { color: var(--muted); }
.meta, .idx, .fig-tag, .fig-hint, .fig-src { font: 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
dl.terms dt { font: 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
dl.terms dd { margin: 0 0 12px; }
a { color: var(--ink); text-decoration-color: var(--faint); }
code { font: .9em var(--mono); border: 1px solid var(--rule); border-radius: 4px; padding: 0 3px; }
.inferred { text-decoration: underline dotted var(--faint); }
.fig { margin: 40px 0; border: 0; background: none; }
.fig-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.fig > svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.fig svg * { vector-effect: non-scaling-stroke; }
.fig svg text { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); stroke: none; }
.fig svg text.lbl { font-size: 11px; }
.fig svg line, .fig svg rect, .fig svg path { fill: none; stroke: var(--ink-2); stroke-width: 1; }
.fig svg .subj { stroke: var(--accent); stroke-width: 1.5; }
.fig svg text.subj, .val { fill: var(--accent); color: var(--accent); stroke: none; }
.ascii { container-type: inline-size; }
.ascii pre { margin: 0; padding: 0; font-family: var(--mono); line-height: 1.2; color: var(--ink-2); user-select: none; font-size: min(1em, calc(100cqw / (var(--cols) * 0.62))); }
.ascii svg.ah path { fill: currentColor; stroke: none; }
.tl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font: 12px/1.4 var(--mono); color: var(--ink-2); }
.tl .track { position: relative; height: 8px; background: var(--well); }
.tl .bar { position: absolute; top: 0; bottom: 0; left: var(--s); width: var(--w); background: var(--ink-2); }
.tl .bar.subj { background: var(--accent); }
.tl .ticks { position: relative; height: 16px; }
.tl .ticks span { position: absolute; left: var(--x); transform: translateX(-50%); }
.tl .ticks span:last-child { transform: translateX(-100%); }
.tl .ticks span:first-child { transform: none; }
figcaption { margin-top: 16px; border-top: 1px dotted var(--rule); padding-top: 10px; font: 13px/1.5 var(--sans); color: var(--ink-2); }
.fig-src { display: block; margin-top: 4px; }
ol.sources { font-size: 13px; color: var(--ink-2); }

</style>
</head>
<body>
<main class="page">
  <figure class="fig" data-kind="schematic">
    <div class="fig-head"><span class="fig-tag">FIG. 1</span></div>
    <svg role="img" aria-label="ok" viewBox="0 0 430 60" width="430" height="60"><text x="10" y="30">ok</text></svg>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure data-kind="pie">
    <div class="fig-head"><span class="fig-tag">FIG. 2</span></div>
    <svg role="img" aria-label="pie" viewBox="0 0 100 60" width="100" height="60"><text x="10" y="30">pie</text></svg>
    <figcaption>No class, unknown kind.</figcaption>
  </figure>
  <figure class="fig" data-kind="chart" role="group">
    <div class="fig-head"><span class="fig-tag">Figure 3</span></div>
    <svg role="img" aria-label="chart" viewBox="0 0 100 60" width="100" height="60"><text x="10" y="30">a</text></svg>
    <figcaption>One.</figcaption>
    <figcaption>Two.</figcaption>
  </figure>
  <figure class="fig" data-kind="schematic">
    <div class="fig-head"><span class="fig-tag">FIG. 5</span></div>
    <svg role="img" viewBox="0 0 300 60" width="600" height="60"><text x="10" y="30">no label</text></svg>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="schematic">
    <div class="fig-head"><span class="fig-tag">FIG. 5</span></div>
    <svg role="img" aria-label="first" viewBox="0 0 430 60" width="430" height="60"><text x="10" y="30">one</text></svg><svg role="img" aria-label="second" viewBox="0 0 430 60" width="430" height="60"><text x="10" y="30">two</text></svg>
    <figcaption>Two bodies.</figcaption>
  </figure>
  <figure class="fig" data-kind="ascii">
    <div class="fig-head"><span class="fig-tag">FIG. 6</span></div>
    <div class="ascii" role="img" aria-label="too wide" style="--cols:60"><pre aria-hidden="true">
xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
client ─────────────────────────────────────────<svg class="ah" aria-hidden="true" viewBox="0 0 6 12" preserveAspectRatio="none" style="width:1ch;height:1.2em;vertical-align:top"><path d="M0 5.6H2V6.4H0Z M1.5 2.8L6 6L1.5 9.2Z" fill="currentColor"/></svg> server</pre></div>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="ascii">
    <div class="fig-head"><span class="fig-tag">FIG. 7</span></div>
    <div class="ascii" role="img" aria-label="no hidden pre"><pre>a &mdash;&gt; b</pre></div>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="panel" data-interactive>
    <div class="fig-head"><span class="fig-tag">FIG. 8</span></div>
    <svg viewBox="0 0 100 60" width="100" height="60"><text x="10" y="30">drag</text></svg><input type="range" min="0" max="1" step="0.1">
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="panel" data-interactive>
    <div class="fig-head"><span class="fig-tag">FIG. 9</span></div>
    <svg viewBox="0 0 100 60" width="100" height="60"><title>Spring response</title><text x="10" y="30">x</text></svg><label>damping <input type="range"></label><button>step</button>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="chart">
    <div class="fig-head"><span class="fig-tag">FIG. 10</span></div>
    <table><tr><th>k</th><td>v</td></tr></table>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="table">
    <div class="fig-head"><span class="fig-tag">FIG. 11</span></div>
    <table><tr><th>k</th><td>v</td></tr></table>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="timeline">
    <div class="fig-head"><span class="fig-tag">FIG. 12</span></div>
    <div class="tl" role="img"><span>a</span><div class="track"></div></div>
    <figcaption>Caption.</figcaption>
  </figure>
  <figure class="fig" data-kind="stack">
    <div class="fig-head"><span class="fig-tag">FIG. 13</span></div>
    <p>No body here.</p>
    <figcaption>Caption.</figcaption>
  </figure>
</main>
</body>
</html>
